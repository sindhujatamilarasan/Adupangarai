# Production: docker compose -f docker-compose.prod.yml up -d --build
# Settings: ./.env (DOMAIN, ACME_EMAIL, DB_PASSWORD) and ./api/.env (app settings). See deploy/README.md.
name: adupangarai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adupangarai
      POSTGRES_USER: adupangarai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adupangarai -d adupangarai"]
      interval: 5s
      retries: 20

  api:
    build: { context: ./api, dockerfile: Dockerfile.prod }
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: adupangarai
      DB_USERNAME: adupangarai
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/app/storage              # uploaded photos + logs survive rebuilds
      - ./downloads:/app/public/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/up"]
      interval: 5s
      start_period: 60s
      retries: 30
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.prod.Dockerfile }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      SITE_ADDRESS: ${SITE_ADDRESS:-https://${DOMAIN}, https://www.${DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api: { condition: service_healthy }

  # Daily database backup at ~02:30 server time, keeping 14 days, in ./backups.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) 02:30" +%s 2>/dev/null || echo $$now)
          [ $$next -le $$now ] && next=$$((next + 86400))
          sleep $$((next - now))
          f=/backups/adupangarai-$$(date +%F).sql.gz
          pg_dump -h db -U adupangarai adupangarai | gzip > $$f.tmp && mv $$f.tmp $$f && echo "backup ok $$f"
          find /backups -name 'adupangarai-*.sql.gz' -mtime +14 -delete
        done
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
