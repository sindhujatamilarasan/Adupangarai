services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adupangarai
      POSTGRES_USER: adupangarai
      POSTGRES_PASSWORD: secret
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adupangarai"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    user: "${UID:-1000}:${GID:-1000}" # files written to ./api stay owned by you
    working_dir: /app
    volumes: ["./api:/app"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Several workers so a slow AI request doesn't block other requests.
      HOME: /tmp
      PHP_CLI_SERVER_WORKERS: 4
    ports: ["8787:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: >
      sh -c "composer install --no-interaction &&
             ([ -f .env ] || (cp .env.example .env && php artisan key:generate)) &&
             ([ -L public/storage ] || ln -s ../storage/app/public public/storage) &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --no-reload --host=0.0.0.0 --port=8000"

  web:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes: ["./web:/app"]
    environment:
      HOME: /tmp
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Free local AI (no key). Swap to a hosted free tier via AI_* settings in api/.env.
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    ports: ["11435:11434"]

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on: [ollama]
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${AI_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  pgdata:
  ollama:
