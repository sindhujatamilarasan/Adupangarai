services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adupangarai
      POSTGRES_USER: adupangarai
      POSTGRES_PASSWORD: secret
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adupangarai"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    working_dir: /app
    volumes: ["./api:/app"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports: ["8787:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "composer install --no-interaction && php artisan migrate --force && php artisan serve --no-reload --host=0.0.0.0 --port=8000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./web:/app"]
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
